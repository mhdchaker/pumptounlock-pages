# Pages CMS (https://app.pagescms.org): edit the blog in the browser.
# Sign in with GitHub, install the Pages CMS GitHub App on this repository, open it.

media:
  - name: blog-images
    label: Blog images
    input: public/img/blog
    output: /img/blog
    rename: safe
    categories: [image]

content:
  - name: blog
    label: Blog articles
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: description
        label: One line under the title
        type: text
        required: true
        options:
          maxlength: 160
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Draft (not shown on the live site)
        type: boolean
        default: true
      - name: listLine
        label: Shorter line for the blog list
        type: string
      - name: author
        label: Author
        type: string
        default: Lisa Perlmann
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: blog-images
          rename: safe
